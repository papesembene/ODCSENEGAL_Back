name: odc-new

x-backend: &backend
  image: odc-backend:${APP_VERSION:-local}
  build: .
  env_file: ${ODC_ENV_FILE:?Chemin absolu du fichier de configuration requis}
  environment: &runtime
    FLASK_ENV: production
    RUN_PREPROD_SEED: "false"
    RUN_INDEX_MAINTENANCE: "false"
    SESSION_TYPE: redis
    REDIS_URL: redis://redis:6379/0
    EMAIL_DELIVERY_MODE: queued
    APP_VERSION: ${APP_VERSION:-local}
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  volumes:
    - app_uploads:/app/app/uploads
    - legacy_uploads:/app/uploads
    - public_uploads:/app/app/static/uploads
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  api:
    <<: *backend
    environment:
      <<: *runtime
      WAITRESS_THREADS: ${WAITRESS_THREADS:-8}
      TRUST_PROXY_HEADERS: "true"

  email-worker:
    <<: *backend
    command: [python, email_worker.py]
    environment:
      <<: *runtime
      MONGO_MAX_POOL_SIZE: "10"
      EMAIL_SEND_INTERVAL_SECONDS: ${EMAIL_SEND_INTERVAL_SECONDS:-1}
    healthcheck:
      test: [CMD, python, -c, "import os,time,tempfile; p=os.path.join(tempfile.gettempdir(),'odc-email-worker-heartbeat'); assert time.time()-os.path.getmtime(p)<60"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  frontend:
    image: odc-frontend:${APP_VERSION:-local}
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Adresse publique HTTPS de l'API requise}
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:?Adresse publique HTTPS du portail requise}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${ODC_HTTP_PORT:-8085}:8080"
    volumes:
      - ./ops/deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/_gateway-health]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  app_uploads:
  legacy_uploads:
  public_uploads:
  redis_data:
