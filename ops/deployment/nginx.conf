# The existing Sonatel HTTPS reverse proxy forwards to 127.0.0.1:8085.
# Do not expose this HTTP listener publicly: forwarded headers are trusted.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
}
resolver 127.0.0.11 valid=10s ipv6=off;

upstream odc_api {
    zone odc_api 64k;
    server api:5000 resolve;
    keepalive 32;
}

upstream odc_frontend {
    zone odc_frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 260m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $public_scheme;
    # TLS proxy must overwrite incoming X-Forwarded-For before forwarding here.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_next_upstream off;

    location = /_gateway-health { access_log off; return 200 'ok'; }
    location = /health { proxy_pass http://odc_api; }
    location = /metrics { return 404; }
    location /api/ { proxy_pass http://odc_api; }
    location /static/ { proxy_pass http://odc_api; }
    location /uploads/ { proxy_pass http://odc_api; }
    location / { proxy_pass http://odc_frontend; }
}
