name: Backend validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    # MongoDB 8.0 refuses kernels >= 6.19 (SERVER-121912).
    # Ubuntu 24.04 runners also use kernel 7.0; 22.04 currently uses 6.8.
    # Temporary compatibility workaround; track runner-images and SERVER-121912.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          TEST_LOCAL_MONGO: "1"
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PYTHONWARNINGS: ignore
